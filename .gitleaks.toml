title = "Llamenos Hotline Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
# Allow test nsec key embedded in demo-mode code
id = "llamenos-test-nsec"
description = "Test nsec keys used in demo mode (explicitly allowed)"
regex = '''nsec174zsa94n3e7t0ugfldh9tgkkzmaxhalr78uxt9phjq3mmn6d6xas5jdffh'''

[allowlist]
description = "Global allowlist for known safe patterns"
regexes = [
  # Test/demo nsec key (intentionally embedded in demo-mode code)
  "nsec174zsa94n3e7t0ugfldh9tgkkzmaxhalr78uxt9phjq3mmn6d6xas5jdffh",
]
regexTarget = "match"
paths = [
  # Drizzle migration snapshots may contain hashed values
  "drizzle/migrations/.*\\.sql",
  # Test fixtures and snapshots
  "tests/.*\\.snap",
  # Colocated unit tests legitimately contain dummy passwords for OPAQUE / auth tests
  "src/.*\\.test\\.ts",
  "src/.*\\.spec\\.ts",
  # Plan documents contain code snippets with variable names that look like keys
  "docs/superpowers/plans/.*\\.md",
  # Epic plan documents contain cryptographic type names that trigger generic-api-key
  "docs/epics/.*\\.md",
  # Security docs describe cryptographic primitives by name (XChaCha20-Poly1305,
  # Ed25519, etc.); the generic-api-key regex occasionally flags those phrases.
  "docs/security/.*\\.md",
  # Crypto source files use branded type names (Ed25519SigningKey, X25519EncryptionKey,
  # AesGcmKey) in type annotations next to `privateKey:` — triggers generic-api-key.
  "src/client/lib/crypto-worker\\.ts",
  "src/client/lib/crypto-worker-client\\.ts",
  "src/client/lib/cross-signing\\.ts",
  "src/client/lib/puk\\.ts",
  "src/client/lib/paper-key\\.ts",
  "src/client/lib/device-identity\\.ts",
  "src/client/lib/hub-key-manager\\.ts",
  "src/client/lib/recovery-group-tier3\\.ts",
  "src/client/lib/webrtc/sframe-.*\\.ts",
  "src/server/lib/hpke-service\\.ts",
  "src/client/lib/crypto-service\\.ts",
  "src/shared/types\\.ts",
  "src/shared/hpke-primitives\\.ts",
]
