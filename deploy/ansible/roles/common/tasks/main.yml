---
# Common role: base packages, NTP, locale, unattended-upgrades, deploy user.
#
# Establishes a consistent, secure baseline across supported distros.
# See vars/{Family}.yml for distro-specific package lists and service names.

- name: Load OS-specific vars
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
        - main.yml
      paths:
        - "{{ role_path }}/vars"

- name: Install base packages
  ansible.builtin.include_tasks: install.yml

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Set locale
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Configure Chrony NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start Chrony
  ansible.builtin.systemd:
    name: "{{ common_chrony_service }}"
    enabled: true
    state: started

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: "{{ common_unattended_upgrades_config_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };

      Unattended-Upgrade::Package-Blacklist {
          "docker-ce";
          "docker-ce-cli";
          "containerd.io";
      };

      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
  when: ansible_facts.os_family == 'Debian'

- name: Enable automatic updates
  ansible.builtin.copy:
    dest: "{{ common_apt_periodic_config_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
  when: ansible_facts.os_family == 'Debian'

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure deploy user has passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL"
    validate: "visudo -cf %s"

- name: Create .ssh directory for deploy user
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0700"

- name: Copy authorized keys to deploy user
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.ssh/authorized_keys"
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
    remote_src: true

- name: Disable snapd (Ubuntu only)
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - snapd
    - snapd.socket
    - snapd.apparmor
  when: ansible_facts.distribution == 'Ubuntu'
