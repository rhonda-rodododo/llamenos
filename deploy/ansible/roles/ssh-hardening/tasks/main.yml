---
# SSH Hardening role
#
# - Disables password authentication
# - Disables root login
# - Changes SSH port
# - Restricts allowed users
# - Hardens SSH crypto settings

- name: Load OS-specific vars
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
        - main.yml
      paths:
        - "{{ role_path }}/vars"

# Ensure the main sshd_config has the Include directive for sshd_config.d/*.conf.
# Without this, drop-ins (including our hardening file) are silently ignored.
# Stock Debian 12/13 and Ubuntu 22.04/24.04 ship with this line, but customised
# pre-existing hosts may have removed or commented it out, bypassing all hardening.
- name: Ensure sshd_config includes sshd_config.d/*.conf drop-ins
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertafter: BOF
    state: present
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# Cloud images (cirruslabs Tart, DigitalOcean, Hetzner, Linode, Vultr, etc.)
# commonly ship /etc/ssh/sshd_config.d/50-cloud-init.conf and/or
# 60-cloudimg-settings.conf that set `PasswordAuthentication yes`. Because
# sshd_config.d uses first-match-wins semantics (alphabetical order), any
# file earlier than our drop-in silently overrides our hardening. We delete
# these drop-ins so the effective config reflects our intent. Our own file
# is written as `00-llamenos-hardening.conf` below so even if cloud-init
# recreates its drop-in on reboot, ours still wins first-match.
- name: Remove cloud-init sshd drop-ins that would override hardening
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ssh_hardening_config_d_path }}/50-cloud-init.conf"
    - "{{ ssh_hardening_config_d_path }}/60-cloudimg-settings.conf"
  notify: Restart sshd

# Remove any leftover 99-llamenos-hardening.conf from previous role
# versions. Operators running this on a previously hardened host would
# otherwise have both 00- and 99- drop-ins present, which is confusing
# even though first-match semantics make the 00- file authoritative.
- name: Remove legacy 99-llamenos-hardening.conf if present
  ansible.builtin.file:
    path: "{{ ssh_hardening_config_d_path }}/99-llamenos-hardening.conf"
    state: absent
  notify: Restart sshd

- name: Configure SSH server
  ansible.builtin.copy:
    dest: "{{ ssh_hardening_config_d_path }}/00-llamenos-hardening.conf"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Llamenos SSH hardening — managed by Ansible
      # Do not edit manually; changes will be overwritten on next deploy.

      # Listen on custom port
      Port {{ ssh_port }}

      # Authentication
      PermitRootLogin no
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      MaxAuthTries 3
      MaxSessions 3
      LoginGraceTime 30

      # Disable unused authentication methods
      HostbasedAuthentication no
      PermitEmptyPasswords no
      KerberosAuthentication no
      GSSAPIAuthentication no

      # Restrict users
      AllowUsers {{ deploy_user }}

      # Disable forwarding (not needed for deployment)
      AllowTcpForwarding no
      AllowAgentForwarding no
      X11Forwarding no
      PermitTunnel no

      # Hardened crypto
      KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

      # Idle timeout (disconnect after 5 minutes of inactivity)
      ClientAliveInterval 300
      ClientAliveCountMax 0

      # Logging
      LogLevel VERBOSE

      # Misc
      PermitUserEnvironment no
      PrintMotd no
      PrintLastLog yes
      TCPKeepAlive no
      Compression no
      UseDNS no
  notify: Restart sshd

- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
