pre-commit:
  parallel: true
  jobs:
    - name: lint-fix
      glob: "*.{ts,tsx,js,jsx}"
      exclude: "*.config.{ts,js,mjs}"
      run: |
        bunx biome check --write --files-ignore-unknown=true --no-errors-on-unmatched {staged_files} >/dev/null 2>&1
        bunx biome check --diagnostic-level=error --files-ignore-unknown=true --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: pii-check
      # Blocks commits that introduce content matching PII_CHECK_PATTERNS.
      # Patterns are read from the env var at commit time — see scripts/pii-check.sh
      # for setup instructions (add `export PII_CHECK_PATTERNS='...'` to ~/.zshrc).
      # If the env var is unset the script warns and passes; if it is set and a
      # match is found in the staged diff, the commit is blocked.
      run: scripts/pii-check.sh
